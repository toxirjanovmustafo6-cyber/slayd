<!DOCTYPE html>
<html lang="uz" class="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kompyuter Texnologiyalari Tarixi va Rivojlanishi</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
		rel="stylesheet">
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					fontFamily: {
						// Manrope — kirill (rus) harflari uchun zaxira shrift
						sans: ['Plus Jakarta Sans', 'Manrope', 'sans-serif'],
						heading: ['Space Grotesk', 'Manrope', 'sans-serif'],
					},
					colors: {
						brand: {
							50: '#f0f9ff',
							500: '#06b6d4',
							600: '#0284c7',
							900: '#0f172a',
						}
					}
				}
			}
		}
	</script>
	<style>
		:root {
			--dot: rgba(255, 255, 255, 0.2);
			--dot-hover: rgba(255, 255, 255, 0.4);
			--lang-idle: #94a3b8;
		}

		body {
			font-family: 'Plus Jakarta Sans', 'Manrope', sans-serif;
			background-color: #090d16;
			color: #f8fafc;
			overflow: hidden;
			user-select: none;
			transition: background-color 0.3s ease, color 0.3s ease;
		}

		.font-heading {
			font-family: 'Space Grotesk', 'Manrope', sans-serif;
		}

		.glass-card {
			background: rgba(15, 23, 42, 0.75);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
		}

		.glass-nav {
			background: rgba(15, 23, 42, 0.85);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border-top: 1px solid rgba(255, 255, 255, 0.1);
		}

		.slide {
			position: absolute;
			inset: 0;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
			transform: scale(0.96) translateY(20px);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 2rem 1.5rem 5rem 1.5rem;
		}

		@media (min-width: 768px) {
			.slide {
				padding: 3rem 4rem 6rem 4rem;
			}
		}

		.slide.active {
			opacity: 1;
			pointer-events: auto;
			transform: scale(1) translateY(0);
		}

		.slide.active .animate-item {
			animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		@keyframes slideUpFade {
			from {
				opacity: 0;
				transform: translateY(30px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.custom-scroll::-webkit-scrollbar {
			width: 6px;
		}

		.custom-scroll::-webkit-scrollbar-track {
			background: rgba(255, 255, 255, 0.05);
			border-radius: 8px;
		}

		.custom-scroll::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, 0.2);
			border-radius: 8px;
		}

		.glow-blob {
			position: absolute;
			border-radius: 50%;
			filter: blur(100px);
			opacity: 0.25;
			pointer-events: none;
			z-index: 0;
			transition: opacity 0.3s ease;
		}

		/* ---------- Progress dots ---------- */
		.dot {
			height: 0.625rem;
			width: 0.625rem;
			border-radius: 9999px;
			background: var(--dot);
			transition: all 0.3s ease;
		}

		.dot:hover {
			background: var(--dot-hover);
		}

		.dot.dot-on {
			width: 2rem;
			background: #22d3ee;
		}

		/* ---------- Language switcher ---------- */
		.lang-btn {
			padding: 0.375rem 0.625rem;
			border-radius: 0.5rem;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.04em;
			color: var(--lang-idle);
			transition: all 0.2s ease;
		}

		.lang-btn:hover {
			color: #0891b2;
		}

		.lang-btn.active {
			background: linear-gradient(to right, #06b6d4, #2563eb);
			color: #fff !important;
			box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
		}

		/* ---------- Diagram (SVG) ---------- */
		.ch-text {
			fill: #94a3b8;
			font-size: 11px;
		}

		.ch-label {
			fill: #e2e8f0;
			font-size: 11px;
			font-weight: 600;
		}

		.ch-grid {
			stroke: rgba(255, 255, 255, 0.08);
			stroke-width: 1;
		}

		.ch-dot {
			stroke: #0f172a;
			stroke-width: 2;
			fill: #06b6d4;
		}

		html:not(.dark) .ch-text {
			fill: #475569;
		}

		html:not(.dark) .ch-label {
			fill: #0f172a;
		}

		html:not(.dark) .ch-grid {
			stroke: rgba(15, 23, 42, 0.1);
		}

		html:not(.dark) .ch-dot {
			stroke: #ffffff;
		}

		.ch-line {
			stroke-dasharray: 1;
			stroke-dashoffset: 1;
		}

		.ch-area,
		.ch-pt {
			opacity: 0;
		}

		.slide.active .ch-line {
			animation: drawLine 2s 0.4s ease forwards;
		}

		.slide.active .ch-area {
			animation: fadeIn 1s 1.4s ease forwards;
		}

		.slide.active .ch-pt {
			animation: fadeIn 0.4s ease forwards;
		}

		@keyframes drawLine {
			to {
				stroke-dashoffset: 0;
			}
		}

		@keyframes fadeIn {
			to {
				opacity: 1;
			}
		}

		/* ---------- PowerPoint-style diagrams ---------- */
		.chev {
			height: 3.5rem;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 0.75rem;
			padding: 0 1rem;
			text-align: center;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
		}

		@media (min-width: 768px) {
			.chev {
				border-radius: 0;
				padding: 0 1.25rem 0 2rem;
				clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%);
				box-shadow: none;
			}

			.chev.chev-first {
				padding-left: 1rem;
				clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
			}

			.chev.chev-wide {
				width: calc(100% + 16px);
			}
		}

		.scroll-inner {
			max-height: 100%;
			overflow-y: auto;
		}

		/* ---------- Music player ---------- */
		#music-btn:not(.is-playing) .ic-pause {
			display: none;
		}

		#music-btn.is-playing .ic-play {
			display: none;
		}

		#music-btn.is-playing {
			color: #22d3ee;
			border-color: rgba(34, 211, 238, 0.5);
		}

		#music-btn.is-playing .ic-note {
			animation: notePulse 1.2s ease-in-out infinite;
		}

		@keyframes notePulse {
			50% {
				transform: scale(1.2);
			}
		}

		/* ---------- Theme toggle icons ---------- */
		html.dark .theme-moon {
			display: none;
		}

		html:not(.dark) .theme-sun {
			display: none;
		}

		/* =====================================================
		   LIGHT MODE (kunduzgi rejim)
		   ===================================================== */
		html:not(.dark) {
			--dot: rgba(15, 23, 42, 0.18);
			--dot-hover: rgba(15, 23, 42, 0.35);
			--lang-idle: #475569;
		}

		html:not(.dark) body {
			background-color: #eef2f7 !important;
			color: #0f172a !important;
		}

		html:not(.dark) .glass-card {
			background: rgba(255, 255, 255, 0.85);
			border: 1px solid rgba(15, 23, 42, 0.08);
			box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
		}

		html:not(.dark) .glass-nav {
			background: rgba(255, 255, 255, 0.88);
			border-top: 1px solid rgba(15, 23, 42, 0.08);
		}

		html:not(.dark) .app-header {
			background: rgba(255, 255, 255, 0.65) !important;
			border-color: rgba(15, 23, 42, 0.08) !important;
		}

		html:not(.dark) .glow-blob {
			opacity: 0.16;
		}

		/* text */
		html:not(.dark) .text-white:not(.keep-white) {
			color: #0f172a;
		}

		html:not(.dark) .text-slate-100,
		html:not(.dark) .text-slate-200,
		html:not(.dark) .text-slate-300 {
			color: #334155;
		}

		html:not(.dark) .text-slate-400 {
			color: #475569;
		}

		html:not(.dark) .text-slate-500 {
			color: #64748b;
		}

		html:not(.dark) .text-cyan-200,
		html:not(.dark) .text-cyan-300 {
			color: #0e7490;
		}

		html:not(.dark) .text-cyan-400 {
			color: #0891b2;
		}

		html:not(.dark) .text-indigo-400 {
			color: #4f46e5;
		}

		html:not(.dark) .text-purple-400 {
			color: #9333ea;
		}

		html:not(.dark) .text-emerald-400 {
			color: #059669;
		}

		html:not(.dark) .text-amber-400 {
			color: #d97706;
		}

		html:not(.dark) .text-blue-400 {
			color: #2563eb;
		}

		html:not(.dark) .text-pink-400 {
			color: #db2777;
		}

		/* gradient headings */
		html:not(.dark) .title-grad {
			background-image: linear-gradient(to right, #0f172a, #0e7490, #4338ca) !important;
		}

		html:not(.dark) .quote-card {
			background-image: linear-gradient(to right, #ecfeff, #ffffff, #eef2ff) !important;
		}

		/* translucent white surfaces -> translucent ink */
		html:not(.dark) .bg-white\/5 {
			background-color: rgba(15, 23, 42, 0.05);
		}

		html:not(.dark) .bg-white\/10 {
			background-color: rgba(15, 23, 42, 0.07);
		}

		html:not(.dark) .hover\:bg-white\/10:hover {
			background-color: rgba(15, 23, 42, 0.1);
		}

		html:not(.dark) .hover\:bg-white\/20:hover {
			background-color: rgba(15, 23, 42, 0.14);
		}

		html:not(.dark) .border-white\/5 {
			border-color: rgba(15, 23, 42, 0.07);
		}

		html:not(.dark) .border-white\/10 {
			border-color: rgba(15, 23, 42, 0.12);
		}

		html:not(.dark) .hover\:text-white:hover {
			color: #0f172a;
		}

		html:not(.dark) .custom-scroll::-webkit-scrollbar-thumb {
			background: rgba(15, 23, 42, 0.25);
		}
	</style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col justify-between relative bg-slate-950 text-slate-100">

	<div class="glow-blob w-[500px] h-[500px] bg-cyan-500 -top-20 -left-20"></div>
	<div class="glow-blob w-[600px] h-[600px] bg-indigo-600 -bottom-30 -right-20"></div>
	<div class="glow-blob w-[400px] h-[400px] bg-purple-600 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

	<header
		class="app-header relative z-20 w-full px-4 sm:px-6 py-4 flex justify-between items-center bg-slate-950/40 backdrop-blur-md border-b border-white/5">
		<div class="flex items-center gap-3">
			<div
				class="keep-white p-2 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20">
				<i data-lucide="cpu" class="w-5 h-5"></i>
			</div>
			<span
				class="title-grad hidden sm:inline font-heading font-bold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400"
				data-i18n="brand">
			</span>
		</div>

		<div class="flex items-center gap-2 sm:gap-4">
			<!-- Til tanlash -->
			<div id="lang-switch" class="flex items-center gap-1 p-1 rounded-xl bg-white/5 border border-white/10">
				<button class="lang-btn" data-lang="uz" title="O'zbekcha">UZ</button>
				<button class="lang-btn" data-lang="en" title="English">EN</button>
				<button class="lang-btn" data-lang="ru" title="Русский">RU</button>
				<button class="lang-btn" data-lang="tr" title="Türkçe">TR</button>
			</div>

			<!-- Qo'shiq (musiqa pleyeri) -->
			<audio id="bg-audio" src="dilmurod-sultonov-mejina_(uzhits.net).mp3" loop preload="none"></audio>
			<input type="file" id="music-file" accept="audio/*" class="hidden">
			<div class="flex items-center gap-1">
				<button id="music-btn"
					class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition border border-white/10 flex items-center gap-1.5"
					data-i18n-title="musicTip">
					<i data-lucide="music" class="w-4 h-4 ic-note"></i>
					<span class="ic-play"><i data-lucide="play" class="w-4 h-4"></i></span>
					<span class="ic-pause"><i data-lucide="pause" class="w-4 h-4"></i></span>
				</button>
				<button id="music-pick"
					class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition border border-white/10"
					data-i18n-title="musicPick">
					<i data-lucide="folder-open" class="w-4 h-4"></i>
				</button>
			</div>

			<!-- Kun / Tun rejimi -->
			<button id="theme-btn"
				class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition border border-white/10"
				data-i18n-title="themeTip">
				<span class="theme-sun"><i data-lucide="sun" class="w-4 h-4"></i></span>
				<span class="theme-moon"><i data-lucide="moon" class="w-4 h-4"></i></span>
			</button>

			<button id="fullscreen-btn"
				class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition border border-white/10"
				data-i18n-title="fsTip">
				<i data-lucide="maximize" class="w-4 h-4"></i>
			</button>
		</div>

		<div
			class="absolute bottom-0 left-0 h-[3px] bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-500 transition-all duration-300"
			id="progress-bar" style="width: 0%;"></div>
	</header>

	<main class="relative z-10 flex-grow w-full max-w-7xl mx-auto flex items-center justify-center">

		<!-- SLIDE 0 -->
		<section class="slide active" id="slide-0">
			<div class="text-center max-w-3xl mx-auto space-y-6">
				<div
					class="animate-item inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-medium text-sm mb-2"
					style="animation-delay: 0.1s;">
					<i data-lucide="sparkles" class="w-4 h-4"></i>
					<span data-i18n="badge"></span>
				</div>

				<h1
					class="title-grad animate-item font-heading font-extrabold text-4xl sm:text-6xl md:text-7xl leading-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400"
					style="animation-delay: 0.2s;" data-i18n="title">
				</h1>

				<p class="animate-item text-lg sm:text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed"
					style="animation-delay: 0.3s;" data-i18n="subtitle">
				</p>

				<div class="animate-item pt-6 flex flex-col sm:flex-row items-center justify-center gap-4"
					style="animation-delay: 0.4s;">
					<button id="start-btn"
						class="keep-white w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold shadow-lg shadow-cyan-500/25 transition transform active:scale-95 flex items-center justify-center gap-3">
						<span data-i18n="start"></span>
						<i data-lucide="arrow-right" class="w-5 h-5"></i>
					</button>
				</div>

				<div class="animate-item pt-10 flex items-center justify-center gap-6 text-slate-500 text-xs sm:text-sm"
					style="animation-delay: 0.5s;">
					<span class="flex items-center gap-2"><kbd
							class="px-2 py-1 bg-white/10 rounded text-slate-300 font-mono">←</kbd> <kbd
							class="px-2 py-1 bg-white/10 rounded text-slate-300 font-mono">→</kbd> <span
							data-i18n="kbdNav"></span></span>
					<span class="flex items-center gap-2"><kbd
							class="px-2 py-1 bg-white/10 rounded text-slate-300 font-mono">Space</kbd> <span
							data-i18n="kbdNext"></span></span>
				</div>
			</div>
		</section>

		<!-- SLIDE 1 -->
		<section class="slide" id="slide-1">
			<div class="w-full max-w-5xl mx-auto space-y-6">
				<div class="animate-item text-center sm:text-left space-y-2" style="animation-delay: 0.1s;">
					<span class="text-cyan-400 text-sm font-semibold tracking-wider uppercase" data-i18n="st1"></span>
					<h2 class="font-heading text-3xl sm:text-4xl font-bold" data-i18n="s1t"></h2>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">

					<div
						class="animate-item glass-card p-6 rounded-2xl border border-white/10 hover:border-cyan-500/40 transition duration-300 flex flex-col justify-between"
						style="animation-delay: 0.2s;">
						<div>
							<div
								class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-4">
								<i data-lucide="calculator" class="w-6 h-6"></i>
							</div>
							<h3 class="font-heading text-xl font-bold text-white mb-2" data-i18n="abName"></h3>
							<p class="text-slate-400 text-sm leading-relaxed" data-i18n="abDesc"></p>
						</div>
						<div class="mt-6 pt-4 border-t border-white/5 text-xs text-cyan-400 font-medium" data-i18n="abDate">
						</div>
					</div>

					<div
						class="animate-item glass-card p-6 rounded-2xl border border-white/10 hover:border-cyan-500/40 transition duration-300 flex flex-col justify-between"
						style="animation-delay: 0.3s;">
						<div>
							<div
								class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-4">
								<i data-lucide="cog" class="w-6 h-6"></i>
							</div>
							<h3 class="font-heading text-xl font-bold text-white mb-2" data-i18n="bbName"></h3>
							<p class="text-slate-400 text-sm leading-relaxed" data-i18n="bbDesc"></p>
						</div>
						<div class="mt-6 pt-4 border-t border-white/5 text-xs text-indigo-400 font-medium" data-i18n="bbDate"></div>
					</div>

					<div
						class="animate-item glass-card p-6 rounded-2xl border border-white/10 hover:border-cyan-500/40 transition duration-300 flex flex-col justify-between"
						style="animation-delay: 0.4s;">
						<div>
							<div
								class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 mb-4">
								<i data-lucide="code-2" class="w-6 h-6"></i>
							</div>
							<h3 class="font-heading text-xl font-bold text-white mb-2" data-i18n="adName"></h3>
							<p class="text-slate-400 text-sm leading-relaxed" data-i18n="adDesc"></p>
						</div>
						<div class="mt-6 pt-4 border-t border-white/5 text-xs text-purple-400 font-medium" data-i18n="adDate">
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- SLIDE 2 -->
		<section class="slide" id="slide-2">
			<div class="w-full max-w-5xl mx-auto space-y-6">
				<div class="animate-item text-center sm:text-left space-y-2" style="animation-delay: 0.1s;">
					<span class="text-cyan-400 text-sm font-semibold tracking-wider uppercase" data-i18n="st2"></span>
					<h2 class="font-heading text-3xl sm:text-4xl font-bold" data-i18n="s2t"></h2>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center pt-2">
					<div class="animate-item glass-card p-6 sm:p-8 rounded-2xl space-y-4" style="animation-delay: 0.2s;">
						<div class="inline-flex p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400">
							<i data-lucide="zap" class="w-6 h-6"></i>
						</div>
						<h3 class="font-heading text-2xl font-bold text-white" data-i18n="vtName"></h3>

		/* =====================================================
			 ASOSIY DASTUR
			 ===================================================== */
		document.addEventListener('DOMContentLoaded', () => {
			lucide.createIcons()

			const slides = document.querySelectorAll('.slide')
			const totalSlides = slides.length
			let currentSlide = 0

			const prevBtn = document.getElementById('prev-btn')
			const nextBtn = document.getElementById('next-btn')
			const startBtn = document.getElementById('start-btn')
			const restartBtn = document.getElementById('restart-btn')
			const fullscreenBtn = document.getElementById('fullscreen-btn')
			const themeBtn = document.getElementById('theme-btn')
			const langButtons = document.querySelectorAll('.lang-btn')
			const currentSlideNum = document.getElementById('current-slide-num')
			const totalSlidesNum = document.getElementById('total-slides-num')
			const progressBar = document.getElementById('progress-bar')
			const dotsContainer = document.getElementById('dots-container')

			totalSlidesNum.textContent = totalSlides

			/* ---------- Saqlangan sozlamalar ---------- */
			function load(key, fallback) {
				try { return localStorage.getItem(key) || fallback } catch (e) { return fallback }
			}
			function save(key, value) {
				try { localStorage.setItem(key, value) } catch (e) { }
			}

			let currentLang = load('lang', 'uz')
			if (!I18N[currentLang]) currentLang = 'uz'

			/* ---------- Qo'shiq pleyeri ---------- */
			const audio = document.getElementById('bg-audio')
			const musicBtn = document.getElementById('music-btn')
			const musicPick = document.getElementById('music-pick')
			const musicFile = document.getElementById('music-file')
			audio.volume = 0.6

			audio.addEventListener('play', () => musicBtn.classList.add('is-playing'))
			audio.addEventListener('pause', () => musicBtn.classList.remove('is-playing'))

			musicBtn.addEventListener('click', () => {
				musicBtn.blur()
				if (!audio.paused) { audio.pause(); return }
				// qoshiq.mp3 topilmasa — fayl tanlash oynasi ochiladi
				audio.play().catch(() => musicFile.click())
			})
			musicPick.addEventListener('click', () => { musicPick.blur(); musicFile.click() })
			musicFile.addEventListener('change', () => {
				const f = musicFile.files[0]
				if (!f) return
				audio.src = URL.createObjectURL(f)
				audio.play().catch(() => { })
			})

			/* ---------- Kun / tun rejimi ---------- */
			function applyTheme(theme) {
				document.documentElement.classList.toggle('dark', theme === 'dark')
				save('theme', theme)
			}

			themeBtn.addEventListener('click', () => {
				const isDark = document.documentElement.classList.contains('dark')
				applyTheme(isDark ? 'light' : 'dark')
			})

			applyTheme(load('theme', 'dark'))

			/* ---------- Til almashtirish ---------- */
			function applyLang(lang) {
				currentLang = lang
				const dict = I18N[lang]
				document.documentElement.lang = lang
				document.title = dict.docTitle
				save('lang', lang)

				document.querySelectorAll('[data-i18n]').forEach(el => {
					const key = el.getAttribute('data-i18n')
					if (dict[key] !== undefined) el.innerHTML = dict[key]
				})
				document.querySelectorAll('[data-i18n-title]').forEach(el => {
					const key = el.getAttribute('data-i18n-title')
					if (dict[key] !== undefined) el.setAttribute('title', dict[key])
				})

				langButtons.forEach(btn => {
					btn.classList.toggle('active', btn.dataset.lang === lang)
				})

				document.querySelectorAll('#dots-container .dot').forEach((dot, idx) => {
					dot.setAttribute('title', `${dict.slideWord} ${idx + 1}`)
				})
			}

			langButtons.forEach(btn => {
				btn.addEventListener('click', () => applyLang(btn.dataset.lang))
			})

			/* ---------- Nuqtalar (dots) ---------- */
			slides.forEach((_, idx) => {
				const dot = document.createElement('button')
				dot.className = 'dot' + (idx === 0 ? ' dot-on' : '')
				dot.addEventListener('click', () => goToSlide(idx))
				dotsContainer.appendChild(dot)
			})

			const dots = dotsContainer.querySelectorAll('.dot')

			function updateSlide() {
				slides.forEach((slide, idx) => {
					slide.classList.toggle('active', idx === currentSlide)
				})

				currentSlideNum.textContent = currentSlide + 1
				prevBtn.disabled = currentSlide === 0
				nextBtn.disabled = false

				const progressPercentage = (currentSlide / (totalSlides - 1)) * 100
				progressBar.style.width = `${progressPercentage}%`

				dots.forEach((dot, idx) => {
					dot.classList.toggle('dot-on', idx === currentSlide)
				})

				lucide.createIcons()
			}

			function goToSlide(index) {
				if (index >= 0 && index < totalSlides) {
					currentSlide = index
					updateSlide()
				}
			}

			function nextSlide() {
				if (currentSlide < totalSlides - 1) {
					currentSlide++
					updateSlide()
				}
			}

			function prevSlide() {
				if (currentSlide > 0) {
					currentSlide--
					updateSlide()
				}
			}

			nextBtn.addEventListener('click', nextSlide)
			prevBtn.addEventListener('click', prevSlide)
			startBtn.addEventListener('click', () => goToSlide(1))
			restartBtn.addEventListener('click', () => goToSlide(0))

			document.addEventListener('keydown', (e) => {
				if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
					e.preventDefault()
					nextSlide()
				} else if (e.key === 'ArrowLeft') {
					prevSlide()
				}
			})

			fullscreenBtn.addEventListener('click', () => {
				if (!document.fullscreenElement) {
					document.documentElement.requestFullscreen().catch(err => {
						console.error(`Fullscreen xatosi: ${err.message}`)
					})
				} else {
					if (document.exitFullscreen) {
						document.exitFullscreen()
					}
				}
			})

			applyLang(currentLang)
			updateSlide()
		});
	</script>
